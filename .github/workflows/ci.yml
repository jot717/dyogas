            kernel/package-lock.json
            trust/package-lock.json
            runtime/package-lock.json
      - working-directory: kernel
        run: npm ci && npm run build
      - working-directory: trust
        run: npm ci && npm run build
      - working-directory: runtime
        run: npm ci
      - working-directory: runtime
        run: npm test
      - working-directory: runtime
        run: npm run build
      - working-directory: runtime/fixtures/consumer
        run: npm ci && npm run build

  agent-sdk:
