name: dyogas-ci

on:
  push:
    paths:
      - "kernel/**"
      - "trust/**"
      - "runtime/**"
      - "sdk/**"
      - "research/**"
      - "knowledge/**"
      - "graph/**"
      - "markdown/**"
      - "human-gate/**"
      - "web-ui/**"
      - "ingestion-e2e/**"
      - "personal-brain/**"
      - "schemas/**"
      - "tools/schema-ci/**"
      - "tools/dev-orch/**"
      - "tools/eng-agent/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "trust/**"
      - "runtime/**"
      - "sdk/**"
      - "research/**"
      - "knowledge/**"
      - "graph/**"
      - "markdown/**"
      - "human-gate/**"
      - "web-ui/**"
      - "ingestion-e2e/**"
      - "personal-brain/**"
      - "schemas/**"
      - "tools/schema-ci/**"
      - "tools/dev-orch/**"
      - "tools/eng-agent/**"
      - ".github/workflows/ci.yml"

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/schema-ci/package-lock.json
      - working-directory: tools/schema-ci
        run: npm ci
      - working-directory: tools/schema-ci
        run: npm run validate

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kernel/package-lock.json
      - working-directory: kernel
        run: npm ci
      - working-directory: kernel
        run: npm test
      - working-directory: kernel
        run: npm run build
      - working-directory: kernel/fixtures/consumer
        run: npm ci && npm run build

  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            kernel/package-lock.json
            trust/package-lock.json
      - working-directory: kernel
        run: npm ci && npm run build
      - working-directory: trust
        run: npm ci
      - working-directory: trust
        run: npm test
      - working-directory: trust
        run: npm run build
      - working-directory: trust/fixtures/consumer
        run: npm ci && npm run build

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
